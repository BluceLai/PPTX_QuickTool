[project]
name = "pptx-quicktool"
version = "0.1.0"
description = "Desktop tool for generating PowerPoint training document skeletons."
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
pptx-quicktool = "pptx_quicktool.__main__:main"

[tool.setuptools.package-data]
pptx_quicktool = ["assets/*.pptx"]

[tool.unittest]
start-dir = "tests"
